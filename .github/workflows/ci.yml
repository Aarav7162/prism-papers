name: PRISM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Build & Test Full-Stack Cockpit
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/prism?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/prism?schema=public"
      R2_ACCOUNT_ID: "dummy_account_id"
      R2_ACCESS_KEY_ID: "dummy_access_key"
      R2_SECRET_ACCESS_KEY: "dummy_secret_key"
      R2_BUCKET_NAME: "prism-papers"
      NODE_ENV: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma Schema & Generate Client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Typecheck (Strict TypeScript)
        run: npm run lint

      - name: Run Backend Integration & Logic Test Suite
        run: npm test

      - name: Build Vite Client Application
        run: npm run build:vite

      - name: Build Next.js 15 Full-Stack App
        run: npm run build

